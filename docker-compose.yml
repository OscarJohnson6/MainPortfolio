# Backend services for OJ Builds.
#
#   docker compose up --build        build and start everything
#   docker compose up --build api    just the main API
#   docker compose logs -f api       follow one service's logs
#   docker compose down              stop and remove the containers (volumes are kept)
#
# The avatar worker and Ollama are NOT in here: they need the GPU, so they run
# directly on the PC (see dev.ps1). The gateway reaches them through
# host.docker.internal.

services:
  api:
    build:
      context: ./backend
      args:
        INSTALL_LATEX: ${INSTALL_LATEX:-true}
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      # TexVoice reads curated .tex files and writes generated audio here.
      - ./imports:/app/imports
      - exports:/app/exports
      - uploads:/app/uploads
      - api-data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  avatar-gateway:
    build: ./backend/avatar/gateway
    ports:
      - "8200:8200"
    env_file:
      - path: ./backend/avatar/gateway/.env
        required: false
    environment:
      # On the Pi, set AVATAR_WORKER_URLS to your PC's LAN address first,
      # e.g. http://192.168.1.50:8100,http://host.docker.internal:8100
      WORKER_URLS: ${AVATAR_WORKER_URLS:-http://host.docker.internal:8100}
    extra_hosts:
      # Makes host.docker.internal work on Linux (the Pi) too.
      - "host.docker.internal:host-gateway"
    volumes:
      - avatar-data:/data
    restart: unless-stopped

volumes:
  exports:
  uploads:
  api-data:
  avatar-data:
